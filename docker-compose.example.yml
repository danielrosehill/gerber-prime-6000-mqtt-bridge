# Copy to docker-compose.yml, copy .env.example to .env, adjust, then:
#   docker compose up -d --build
services:
  gerber-mqtt-bridge:
    build: .
    container_name: gerber-mqtt-bridge
    restart: unless-stopped
    environment:
      GERBER_HOST: "${GERBER_HOST}"
      GERBER_USER: "${GERBER_USER:-admin}"
      GERBER_PASS: "${GERBER_PASS:-888888}"
      GERBER_UID: "${GERBER_UID:-257}"
      RELAY_CHIDS: "${RELAY_CHIDS:-1,2,3,4,5,6}"
      SHUTTER_CHIDS: "${SHUTTER_CHIDS:-7}"
      MQTT_HOST: "${MQTT_HOST}"
      MQTT_PORT: "${MQTT_PORT:-1883}"
      MQTT_USER: "${MQTT_USER:-}"
      MQTT_PASS: "${MQTT_PASS:-}"
      MQTT_BASE_TOPIC: "${MQTT_BASE_TOPIC:-gerber/gps6000}"
      DEVICE_NAME: "${DEVICE_NAME:-Gerber Prime 6000}"
      POLL_INTERVAL: "${POLL_INTERVAL:-10}"
